# SO-ARM101 action-policy SFT on Cosmos3-Edge — run config for the
# `action_policy_so101_edge` experiment. Single-GPU shape (one RTX Pro 6000 /
# A100 80GB): FSDP shard 1 x replicate 1, 8 samples per rank x grad_accum 8 =
# effective batch 64. The dataset is small (270 episodes, ~77k frames at 15 fps,
# ~4.8k distinct 17-frame windows per epoch at chunk 16), so iters are set for
# ~4 epochs; tune after the first run.
# Env: SO101_ROOT, BASE_CHECKPOINT_PATH (Cosmos3-Edge DCP), WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_so101_edge"
project      = "cosmos3_so101"
group        = "action_sft"
name         = "action_policy_so101_edge"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056

[model.parallelism]
data_parallel_shard_degree     = 1
data_parallel_replicate_degree = 1    # 1 GPU; raise shard degree on multi-GPU nodes

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [5000]
warm_up_steps = [200]

[dataloader_train]
max_samples_per_batch = 8   # per-rank samples (17-frame 256x512 clips); raise if memory allows

[dataloader_train.dataloader]
num_workers     = 8
prefetch_factor = 2

[trainer]
max_iter        = 5000
logging_iter    = 50
grad_accum_iter = 8       # effective batch = 8 x 1 x 8 = 64

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
