# SO-ARM101 WRIST-ONLY action-policy SFT on Cosmos3-Edge — run config for the
# `action_policy_so101_edge_wrist` experiment: identical to the concat-view run
# except the observation is the wrist camera alone (256x256 instead of 256x512),
# which is what the live SO-ARM101 rig can actually provide. Single-GPU shape (one RTX Pro 6000 /
# A100 80GB): FSDP shard 1 x replicate 1, 8 samples per rank x grad_accum 8 =
# effective batch 64. The dataset is small (270 episodes, ~77k frames at 15 fps,
# ~4.8k distinct 17-frame windows per epoch at chunk 16), so iters are set for
# ~8 epochs; the concat-view run's 5000 iters were still improving at the end.
# Env: SO101_ROOT, BASE_CHECKPOINT_PATH (Cosmos3-Edge DCP), WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_so101_edge_wrist"
project      = "cosmos3_so101"
group        = "action_sft"
name         = "action_policy_so101_edge_wrist"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056

[model.parallelism]
data_parallel_shard_degree     = 1
data_parallel_replicate_degree = 1    # 1 GPU; raise shard degree on multi-GPU nodes

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [10000]
warm_up_steps = [200]

[dataloader_train]
max_samples_per_batch = 8   # per-rank samples (17-frame 256x512 clips); raise if memory allows

# Worker count is not a TOML key on this schema; pass it as a Hydra tail override:
#   dataloader_train.dataloader.num_workers=8

[trainer]
max_iter        = 10000
logging_iter    = 50
grad_accum_iter = 8       # effective batch = 8 x 1 x 8 = 64

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 2000   # DCP checkpoints are ~36 GB each and nothing prunes them: 10000/2000 = 5
                   # checkpoints = ~180 GB. save_iter 500 would need ~720 GB.
